name: MailGuard v53 complementary lexical rescue
on:
  workflow_dispatch:
  push:
    branches: [mailguard-v48-calibrated]
    paths: ['tools/train_v53_complement.py', '.github/workflows/v53-residual.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: v53-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v40-fresh50k
          key: v40-fresh50k-v1
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v48-evidence
          run-id: 37990866495
          github-token: ${{ github.token }}
          path: .cache/v48-artifact
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v50-neural-evidence
          run-id: 38052979294
          github-token: ${{ github.token }}
          path: .cache/v50-artifact
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v51-evidence
          run-id: 38056209730
          github-token: ${{ github.token }}
          path: .cache/v51-artifact
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v52-evidence
          run-id: 38064046322
          github-token: ${{ github.token }}
          path: .cache/v52-artifact
      - run: python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python3 -m pip install numpy scipy scikit-learn joblib datasets
      - run: python3 -m unittest discover -s tests/python -p 'test_v*.py'
      - name: Fast 1000-row check
        run: python3 -u tools/train_v53_complement.py --limit 1000
      - name: Calibrate lexical rescue on validation only
        run: python3 -u tools/train_v53_complement.py --limit 0 --output reports/v53-full
      - name: Fixed gate engineering comparison
        run: python3 -u tools/evaluate_v48_fresh.py --artifact-root reports --model-subdir v53-full --count 100000 --min-recall .98 --max-fp 100 --output reports/v53-engineering
      - name: Summary
        if: always()
        run: |
          for report in reports/v53-full/report.md reports/v53-engineering/report.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailguard-v53-evidence
          path: reports/v53-*/
          retention-days: 30
