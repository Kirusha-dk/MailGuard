name: MailGuard v64 frozen first-use transfer evaluation
permissions:
  contents: read
  actions: read
concurrency:
  group: v64-transfer-evaluation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  score:
    needs: wait-for-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: mailguard-v64-frozen-model
        run-id: 38615175304
        github-token: ${{ github.token }}
        path: .cache/v64
    - uses: actions/download-artifact@v4
      with:
        name: v64-new500k-audit
        path: prepared
        run-id: 38635836571
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v4
      with:
        name: v64-new500k-input-${{ matrix.shard }}
        path: prepared
        run-id: 38635836571
        github-token: ${{ github.token }}
    - name: Frozen runtime dependencies
      run: 'python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu

        python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0

        '
    - name: Verify first 1000 against both saved runtimes; evaluate both frozen profiles
      run: "python -m unittest discover -s tests/python -p 'test_v64_transfer.py'\npython -u tools/evaluate_v64_transfer.py\
        \ --phase score --shard ${{ matrix.shard }} \\\n  --input prepared/input-${{ matrix.shard }}.jsonl.gz --output predictions\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: v64-transfer-predictions-${{ matrix.shard }}
        path: predictions/
        compression-level: 0
        retention-days: 90
  report:
    needs: score
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: v64-new500k-audit
        path: prepared
        run-id: 38635836571
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v4
      with:
        pattern: v64-transfer-predictions-*
        path: combined
    - name: Verify all 500000 saved decisions; measure unseen-source and temporal transfer
      run: 'python -u tools/evaluate_v64_transfer.py --phase aggregate --input combined --output reports/v64-transfer

        cat reports/v64-transfer/report.md >> "$GITHUB_STEP_SUMMARY"

        '
    - uses: actions/upload-artifact@v4
      with:
        name: mailguard-v64-new-transfer-result
        path: 'reports/v64-transfer/

          combined/

          '
        compression-level: 0
        retention-days: 90
    - name: Save transfer report in repository
      run: 'cp reports/v64-transfer/report.json /tmp/mailguard-v64-transfer-result.json

        cp reports/v64-transfer/report.md /tmp/mailguard-v64-transfer-result.md

        git fetch origin mailguard-v48-calibrated

        git checkout -B mailguard-v48-calibrated origin/mailguard-v48-calibrated

        cp /tmp/mailguard-v64-transfer-result.json reports/v64-transfer-result.json

        cp /tmp/mailguard-v64-transfer-result.md reports/v64-transfer-result.md

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add -f reports/v64-transfer-result.json reports/v64-transfer-result.md

        git commit -m ''Record frozen v62 and v64 transfer on 500000 first-use public mail''

        git push origin HEAD:mailguard-v48-calibrated

        '
    - name: Preserve permanent predictions, report and exact evaluator source
      env:
        GH_TOKEN: ${{ github.token }}
      run: "tar -czf mailguard-v64-transfer-results.tar.gz reports/v64-transfer combined prepared/audit.json\ngit archive\
        \ --format=tar.gz --output=mailguard-v64-transfer-evaluator.tar.gz '${{ github.sha }}'\nsha256sum mailguard-v64-transfer-results.tar.gz\
        \ mailguard-v64-transfer-evaluator.tar.gz > mailguard-v64-transfer-results.sha256\ngh release create \"mailguard-v64-transfer-results-${{\
        \ github.run_id }}\" --draft \\\n  --target 3a4c834aa61f3b0cbd5725543f22a1225ff3f839 \\\n  --title 'MailGuard v64\
        \ and v62: first-use transfer results' \\\n  --notes-file reports/v64-transfer/report.md \\\n  mailguard-v64-transfer-results.tar.gz\
        \ mailguard-v64-transfer-evaluator.tar.gz mailguard-v64-transfer-results.sha256\n"
  wait-for-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Wait for permanently frozen first-use inputs
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run watch 38635836571 --repo '${{ github.repository }}' --interval 30 --exit-status
'on':
  workflow_dispatch: null
  push:
    branches:
    - mailguard-v48-calibrated
    paths:
    - tools/evaluate_v64_transfer.py
    - .github/workflows/v64-transfer-evaluate.yml
