name: Fast real Bayes comparison

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/benchmark_fast.py'
      - 'rspamd/**'
      - 'docker-compose.yml'
      - '.github/workflows/fast-real-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Start Rspamd and Redis
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d redis rspamd
          docker compose ps

      - name: Run real comparison
        run: python3 tools/benchmark_fast.py

      - name: Show result
        if: always()
        run: |
          if [ -f reports/fast-benchmark.md ]; then
            cat reports/fast-benchmark.md
            cat reports/fast-benchmark.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark report missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-fast-real-benchmark
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/
            .cache/spamassassin-fast/

      - name: Save Docker logs on failure
        if: failure()
        run: docker compose logs --no-color > reports/docker.log 2>&1 || true
