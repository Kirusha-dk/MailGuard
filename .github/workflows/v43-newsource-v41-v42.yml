name: MailGuard v43 new-source v41 plus v42\n\non:\n  workflow_dispatch:\n  push:\n    branches: [main]\n    paths:\n      - 'tools/benchmark_v43_newsource_v41_v42.py'\n      - '.github/workflows/v43-newsource-v41-v42.yml'\n\npermissions:\n  contents: read\n  actions: read\n\nconcurrency:\n  group: mailguard-v43-newsource-${{ github.ref }}\n  cancel-in-progress: false\n\njobs:\n  benchmark:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 355\n    env:\n      OMP_NUM_THREADS: 6\n      MKL_NUM_THREADS: 6\n      HF_HOME: .cache/huggingface\n\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Test audit guards\n        run: python3 -m unittest discover -s tests/python -v\n\n      - name: Restore EXACT frozen v40 corpus\n        uses: actions/cache/restore@v4\n        with:\n          path: .cache/v40-fresh50k\n          key: v40-fresh50k-v1\n          fail-on-cache-miss: true\n\n      - name: Restore public dataset cache\n        uses: actions/cache/restore@v4\n        with:\n          path: |\n            .cache/huggingface\n            .cache/spamassassin-improved\n            .cache/enron-spam-large\n          key: v43-public-corpora-v1\n\n      - name: Download frozen v42 checkpoint\n        uses: actions/download-artifact@v4\n        with:\n          name: mailguard-v42-night-hybrid\n          path: .cache/v42-artifact\n          repository: Kirusha-dk/MailGuard\n          run-id: 37242558633\n          github-token: ${{ secrets.GITHUB_TOKEN }}\n\n      - name: Install dependencies\n        run: |\n          python3 -m pip install numpy scipy scikit-learn datasets pyarrow\n          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu\n\n      - name: Configure disposable audited Rspamd\n        run: |\n          mkdir -p reports\n          printf 'enabled = false;\n' > rspamd/local.d/greylist.conf\n          printf '\nautolearn = false;\n' >> rspamd/local.d/classifier-bayes.conf\n          docker compose up -d redis rspamd\n          docker compose exec -T rspamd rspamadm configtest\n          docker compose exec -T rspamd rspamadm configdump classifier > reports/v43-effective-classifier.txt\n\n      - name: Run v43 new-source benchmark\n        run: python3 -u tools/benchmark_v43_newsource_v41_v42.py\n\n      - name: Publish summary\n        if: always()\n        run: |\n          if [ -f reports/v43-newsource.md ]; then\n            cat reports/v43-newsource.md >> "$GITHUB_STEP_SUMMARY"\n          else\n            echo 'No valid v43 result yet; inspect logs/evidence.' >> "$GITHUB_STEP_SUMMARY"\n          fi\n          docker compose logs --no-color rspamd > reports/v43-rspamd.log 2>&1 || true\n\n      - name: Save v43 evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: mailguard-v43-newsource-v41-v42\n          retention-days: 30\n          if-no-files-found: warn\n          path: |\n            reports/v43-*\n            .cache/v43-newsource/manifest.json\n\n      - name: Save public dataset cache\n        if: always()\n        uses: actions/cache/save@v4\n        with:\n          path: |\n            .cache/huggingface\n            .cache/spamassassin-improved\n            .cache/enron-spam-large\n          key: v43-public-corpora-v1\n