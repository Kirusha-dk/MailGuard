name: MailGuard v34 hybrid rescue 50k

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/benchmark_v34_hybrid_rescue.py'
      - '.github/workflows/v34-hybrid-rescue.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      OMP_NUM_THREADS: 6
      MKL_NUM_THREADS: 6
      HF_HOME: .cache/huggingface

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy scikit-learn datasets pyarrow
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Start Rspamd and Redis
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d redis rspamd

      - name: Cache public corpora
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/spamassassin-improved
            .cache/enron-spam-large
          key: v34-public-corpora-v1
          restore-keys: |
            v33-public-corpora-v1
            v32-public-corpora-v1
            v31-public-corpora-v1

      - name: Cache sanitized rendered split
        uses: actions/cache@v4
        with:
          path: .cache/v31-sanitized-crosssource
          key: v31-sanitized-crosssource-rendered-v1

      - name: Run v34 hybrid rescue 50k benchmark
        run: python3 -u tools/benchmark_v34_hybrid_rescue.py

      - name: Show result
        if: always()
        run: |
          if [ -f reports/v34-hybrid-rescue-50k.md ]; then
            cat reports/v34-hybrid-rescue-50k.md
            cat reports/v34-hybrid-rescue-50k.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "v34 report missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save evidence and model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-v34-hybrid-rescue-50k
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/v34-hybrid-rescue-50k.json
            reports/v34-hybrid-rescue-50k.md
            models/v34/
