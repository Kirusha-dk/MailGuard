name: MailGuard v59 multilingual ham and new mail
on:
  workflow_dispatch:
  push:
    branches: [mailguard-v48-calibrated]
    paths: ['tools/prepare_v59_new_mail.py', 'tools/train_v59_new_mail.py', 'tools/v59_mail.py', 'tools/v59_runtime.py', 'tests/python/test_v59_new_mail.py', '.github/workflows/v59-new-mail.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: v59-new-mail-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v40-fresh50k
          key: v40-fresh50k-v1
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v55-evidence
          run-id: 38137477063
          github-token: ${{ github.token }}
          path: .cache/v55
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v56-evidence
          run-id: 38171539756
          github-token: ${{ github.token }}
          path: .cache/v56
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v54-unique500k-corpus
          run-id: 38092976048
          github-token: ${{ github.token }}
          path: .cache/v54-corpus
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v54-unique500k-evidence
          run-id: 38092976048
          github-token: ${{ github.token }}
          path: .cache/v54-evidence
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 datasets
      - name: Charset and temporal split regressions
        run: python -m unittest discover -s tests/python -p 'test_v59_new_mail.py'
      - uses: actions/cache/restore@v4
        id: fresh-data
        with:
          path: .cache/v59-data
          key: mailguard-v59-new-mail-v1
      - name: Freeze new email families and provenance before fitting
        if: steps.fresh-data.outputs.cache-hit != 'true'
        run: echo 'New TEST will be locked before training.'
      - uses: actions/cache/restore@v4
        id: prior-blocking
        if: steps.fresh-data.outputs.cache-hit != 'true'
        with:
          path: .cache/v59-data
          key: mailguard-v59-prior-blocking-v1
      - name: Restore old development rows and block all previous sources
        if: steps.fresh-data.outputs.cache-hit != 'true' && steps.prior-blocking.outputs.cache-hit != 'true'
        run: python -u tools/prepare_v59_new_mail.py --phase old
      - uses: actions/cache/save@v4
        if: steps.fresh-data.outputs.cache-hit != 'true' && steps.prior-blocking.outputs.cache-hit != 'true'
        with:
          path: .cache/v59-data
          key: mailguard-v59-prior-blocking-v1
      - name: Freeze new Chinese and 2026 mail families
        if: steps.fresh-data.outputs.cache-hit != 'true'
        run: python -u tools/prepare_v59_new_mail.py --phase new
      - uses: actions/cache/save@v4
        if: steps.fresh-data.outputs.cache-hit != 'true'
        with:
          path: .cache/v59-data
          key: mailguard-v59-new-mail-v1
      - name: Train, select, calibrate; then compare with frozen v57 on new TEST
        run: python -u tools/train_v59_new_mail.py
      - name: Build offline customer image
        run: docker build -f Dockerfile.customer -t mailguard-v59-check .
      - name: Check customer entry point without network access
        run: |
          mkdir -p checks/input/ham checks/input/spam checks/output
          python - <<'PY'
          from pathlib import Path
          from email.message import EmailMessage
          for folder, body in [('ham', 'Please confirm the meeting tomorrow.'), ('spam', 'Buy cheap pills now at https://example.invalid')]:
              msg = EmailMessage()
              msg['From'] = 'sender@example.invalid'
              msg['Subject'] = 'Offline packaging check'
              msg.set_content(body)
              Path(f'checks/input/{folder}/mail.eml').write_bytes(msg.as_bytes())
          PY
          for profile in conservative high-recall; do
            docker run --rm --network none -v "$PWD/reports/v59-full:/model:ro" \
              -v "$PWD/checks:/checks" mailguard-v59-check --model-dir /model \
              --ham /checks/input/ham --spam /checks/input/spam --output "/checks/output/$profile" --profile "$profile"
          done
      - name: Package permanent research checkpoint
        run: |
          tar -czf mailguard-v59-model.tar.gz -C reports v59-full
          sha256sum mailguard-v59-model.tar.gz > mailguard-v59-model.sha256
          gh release create "mailguard-v59-checkpoint-${{ github.run_id }}" --draft --target '${{ github.sha }}' \
            --title 'MailGuard v59 — new email evaluation' --notes-file reports/v59-full/report.md \
            mailguard-v59-model.tar.gz mailguard-v59-model.sha256
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Summary
        if: always()
        run: if [ -f reports/v59-full/report.md ]; then cat reports/v59-full/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailguard-v59-evidence
          path: |
            reports/v59-full/
            .cache/v59-data/provenance.json
            .cache/v59-data/manifest.csv
            checks/output/
          retention-days: 90
          include-hidden-files: true
