name: MailGuard v63 joint character and semantic evidence
on:
  workflow_dispatch:
  push:
    branches: [mailguard-v48-calibrated]
    paths: ['tools/train_v63_joint_evidence.py', 'tools/v63_runtime.py', 'tools/v63_neighbours.py', 'tools/v63_portable_encoder.py', 'tests/python/test_v63_neighbours.py', '.github/workflows/v63-joint-evidence.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: v63-joint-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the frozen v62 checkpoint
        run: |
          conclusion=''
          for attempt in {1..120}; do
            conclusion=$(gh api 'repos/${{ github.repository }}/actions/runs/38468905929' --jq '.conclusion // "running"') || conclusion=running
            if [ "$conclusion" = success ] || [ "$conclusion" = failure ]; then break; fi
            if [ "$conclusion" != running ]; then echo "v62 preparation failed: $conclusion"; exit 1; fi
            sleep 30
          done
          test "$conclusion" = success || test "$conclusion" = failure
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v61-dev
          key: mailguard-v61-semantic-dev-v1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v61-cal-query
          key: mailguard-v61-cal-query-v1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v61-new
          key: mailguard-v61-october-20261013-v1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v60-data
          key: mailguard-v60-new-mail-v1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v59-data
          key: mailguard-v59-new-mail-v1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v40-fresh50k
          key: v40-fresh50k-v1
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v55-evidence
          run-id: 38137477063
          github-token: ${{ github.token }}
          path: .cache/v55
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v54-unique500k-corpus
          run-id: 38092976048
          github-token: ${{ github.token }}
          path: .cache/v54-corpus
      - name: Dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 onnxruntime==1.23.2 tokenizers==0.22.1 onnx==1.19.1
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v61-evidence
          run-id: 38465721316
          github-token: ${{ github.token }}
          path: .cache/v61-frozen
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v62-evidence
          run-id: 38468905929
          github-token: ${{ github.token }}
          path: .cache/v62-frozen
      - name: Verify character and semantic feature isolation
        run: |
          python -m unittest discover -s tests/python -p 'test_v61_semantic.py'
          python -m unittest discover -s tests/python -p 'test_v62_script.py'
          python -m unittest discover -s tests/python -p 'test_v63_neighbours.py'
      - name: Joint gate using only TRAIN-fitted inputs
        id: fit
        run: |
          python -u tools/train_v63_joint_evidence.py
          if [ -f reports/v63-full/model.joblib ]; then echo 'trained=true' >> "$GITHUB_OUTPUT"; else echo 'trained=false' >> "$GITHUB_OUTPUT"; fi
      - name: Build offline checker
        if: steps.fit.outputs.trained == 'true'
        run: docker build -f Dockerfile.v63-check -t mailguard-v63-check .
      - name: Verify both saved runtime profiles without network
        if: steps.fit.outputs.trained == 'true'
        run: |
          mkdir -p checks/input/ham checks/input/spam checks/output
          python - <<'PY'
          from pathlib import Path
          from email.message import EmailMessage
          for folder,body in [('ham','Please confirm the meeting tomorrow.'),('spam','Buy cheap pills now at https://example.invalid')]:
              msg=EmailMessage(); msg['From']='sender@example.invalid'; msg['Subject']='Offline packaging check'; msg.set_content(body)
              Path(f'checks/input/{folder}/mail.eml').write_bytes(msg.as_bytes())
          PY
          for profile in conservative high-recall; do
            docker run --rm --network none -v "$PWD/reports/v63-full:/model:ro" \
              -v "$PWD/checks:/checks" mailguard-v63-check --model-dir /model \
              --ham /checks/input/ham --spam /checks/input/spam --output "/checks/output/$profile" --profile "$profile"
          done
      - name: Preserve permanent research checkpoint
        if: steps.fit.outputs.trained == 'true'
        run: |
          tar -czf mailguard-v63-model.tar.gz -C reports v63-full
          sha256sum mailguard-v63-model.tar.gz > mailguard-v63-model.sha256
          gh release create "mailguard-v63-checkpoint-${{ github.run_id }}" --draft --target '${{ github.sha }}' \
            --title 'MailGuard v63 — joint evidence evaluation' --notes-file reports/v63-full/report.md \
            mailguard-v63-model.tar.gz mailguard-v63-model.sha256
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Summary
        if: always()
        run: if [ -f reports/v63-full/report.md ]; then cat reports/v63-full/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailguard-v63-evidence
          path: |
            reports/v63-full/
            checks/output/
          retention-days: 90
