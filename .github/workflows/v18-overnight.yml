name: MailGuard v18 overnight neural

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/benchmark_v18_overnight.py'
      - '.github/workflows/v18-overnight.yml'

permissions:
  contents: read

jobs:
  overnight:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: 6
      MKL_NUM_THREADS: 6

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy scikit-learn
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Start Rspamd and Redis
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d redis rspamd

      - name: Cache SpamAssassin corpus
        uses: actions/cache@v4
        with:
          path: .cache/spamassassin-improved
          key: spamassassin-public-improved-v1

      - name: Cache Enron-Spam corpus
        uses: actions/cache@v4
        with:
          path: .cache/enron-spam-large
          key: enron-spam-large-v1

      - name: Train v18 overnight
        run: python3 -u tools/benchmark_v18_overnight.py

      - name: Show result
        if: always()
        run: |
          if [ -f reports/v18-overnight.md ]; then
            cat reports/v18-overnight.md
            cat reports/v18-overnight.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "v18 report missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save model and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-v18-overnight
          retention-days: 30
          if-no-files-found: warn
          path: |
            models/v18/
            reports/v18-overnight.json
            reports/v18-overnight.md
