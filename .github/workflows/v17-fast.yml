name: MailGuard v17 fast 1500 benchmark

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/benchmark_v17_fast.py'
      - '.github/workflows/v17-fast.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy scikit-learn

      - name: Start Rspamd and Redis
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d redis rspamd

      - name: Cache public corpus
        uses: actions/cache@v4
        with:
          path: .cache/spamassassin-improved
          key: spamassassin-public-improved-v1

      - name: Run v17 fast benchmark
        run: python3 -u tools/benchmark_v17_fast.py

      - name: Show result
        if: always()
        run: |
          if [ -f reports/v17-benchmark.md ]; then
            cat reports/v17-benchmark.md
            cat reports/v17-benchmark.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "v17 report missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-v17-fast-1500
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/v17-benchmark.json
            reports/v17-benchmark.md
