name: MailGuard v41 audited same 50k
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/benchmark_v41_audited.py'
      - 'tools/rspamd_benchmark_audit.py'
      - 'tests/python/test_rspamd_audit.py'
      - '.github/workflows/v41-audited.yml'
permissions:
  contents: read
concurrency:
  group: mailguard-v41-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      OMP_NUM_THREADS: 6
      MKL_NUM_THREADS: 6
      HF_HOME: .cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - name: Test audit guards
        run: python3 -m unittest discover -s tests/python -v
      - name: Restore EXACT v40 corpus
        uses: actions/cache/restore@v4
        with:
          path: .cache/v40-fresh50k
          key: v40-fresh50k-v1
          fail-on-cache-miss: true
      - name: Install dependencies
        run: |
          python3 -m pip install numpy scipy scikit-learn datasets pyarrow
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Restore public archive cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/huggingface
            .cache/spamassassin-improved
            .cache/enron-spam-large
          key: v40-public-corpora-v1
      - name: Configure disposable offline benchmark
        run: |
          mkdir -p reports
          printf 'enabled = false;\n' > rspamd/local.d/greylist.conf
          printf '\nautolearn = false;\n' >> rspamd/local.d/classifier-bayes.conf
          docker compose up -d redis rspamd
          docker compose exec -T rspamd rspamadm configtest
          docker compose exec -T rspamd rspamadm configdump classifier > reports/v41-effective-classifier.txt
      - name: Run v41 on frozen v40 data
        run: python3 -u tools/benchmark_v41_audited.py
      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/v41-audited.md ]; then
            cat reports/v41-audited.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No valid v41 result. Inspect audit evidence; do not treat this as a successful benchmark.' >> "$GITHUB_STEP_SUMMARY"
          fi
          docker compose logs --no-color rspamd > reports/v41-rspamd.log 2>&1 || true
      - name: Save checkpoint and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-v41-audited
          retention-days: 30
          path: |
            reports/v41-*
            models/v41/
