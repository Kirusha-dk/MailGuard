name: MailGuard v46 multilingual semantic hybrid

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/train_v46_semantic_hybrid.py'
      - '.github/workflows/v46-semantic-hybrid.yml'

permissions:
  contents: read

concurrency:
  group: mailguard-v46-semantic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: .cache/huggingface

    steps:
      - uses: actions/checkout@v4

      - name: Restore EXACT frozen v40 corpus
        uses: actions/cache/restore@v4
        with:
          path: .cache/v40-fresh50k
          key: v40-fresh50k-v1
          fail-on-cache-miss: true

      - name: Restore Hugging Face cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/huggingface
          key: v46-hf-${{ runner.os }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy scikit-learn datasets pyarrow joblib sentence-transformers

      - name: Train and evaluate v46
        run: python3 -u tools/train_v46_semantic_hybrid.py

      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/v46-semantic-hybrid.md ]; then
            cat reports/v46-semantic-hybrid.md
            cat reports/v46-semantic-hybrid.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "v46 did not produce a final report; inspect logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save v46 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-v46-semantic-hybrid
          retention-days: 30
          if-no-files-found: warn
          path: |
            models/v46/
            reports/v46-semantic-hybrid.json
            reports/v46-semantic-hybrid.md

      - name: Save Hugging Face cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/huggingface
          key: v46-hf-${{ runner.os }}-${{ github.run_id }}
