name: MailGuard v67 local translation retrospective experiment
on:
  workflow_dispatch:
  push:
    branches: [mailguard-v48-calibrated]
    paths:
      - tools/v67_translation_ablation.py
      - tests/python/test_v67_translation_ablation.py
      - .github/workflows/v67-translation-ablation.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mailguard-v67-translation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  retrospective-translation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v66-cohort-frozen-before-predictions
          run-id: 38773639374
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: v64-transfer-prior-exclusions
          run-id: 38629238441
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          pattern: v64-new500k-input-*
          run-id: 38635836571
          github-token: ${{ github.token }}
          path: previous
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v64-frozen-model
          run-id: 38615175304
          github-token: ${{ github.token }}
          path: models/v64
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v65-retrospective-rescue
          run-id: 38642773109
          github-token: ${{ github.token }}
          path: models/v65
      - name: Install local CPU translation and frozen classification dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0
          python -m pip install transformers==4.57.6 sentencepiece==0.2.1 safetensors==0.7.0
      - name: Test label-blind replay, threshold guard and FP accounting
        run: python -m unittest discover -s tests/python -p 'test_v67_translation_ablation.py' -v
      - name: Score pinned local Turkish to English model on bounded already-scored v66 mail
        run: |
          python -u tools/v67_translation_ablation.py \
            --manifest frozen/manifest.json --prior prior/blocked.sqlite \
            --old-input previous --model64 models/v64 --model65 models/v65 \
            --output report-v67
          cat report-v67/result.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailguard-v67-retrospective-translation-report
          path: report-v67/
          retention-days: 90
      - name: Archive only aggregate retrospective comparison in repo
        run: |
          cp report-v67/result.json /tmp/mailguard-v67.json
          cp report-v67/result.md /tmp/mailguard-v67.md
          git fetch origin mailguard-v48-calibrated
          git checkout -B mailguard-v48-calibrated origin/mailguard-v48-calibrated
          cp /tmp/mailguard-v67.json reports/v67-translation-result.json
          cp /tmp/mailguard-v67.md reports/v67-translation-result.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/v67-translation-result.json reports/v67-translation-result.md
          if ! git diff --cached --quiet; then
            git commit -m 'Document first local-translation A/B on previously scored v66 Turkish mail'
            git push origin HEAD:mailguard-v48-calibrated
          fi
