name: MailGuard v27 diverse training 50k

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/benchmark_v27_diverse50k.py'
      - '.github/workflows/v27-diverse50k.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: 6
      MKL_NUM_THREADS: 6
      HF_HOME: .cache/huggingface

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy scikit-learn datasets pyarrow
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Start Rspamd and Redis
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d redis rspamd

      - name: Cache SpamAssassin corpus
        uses: actions/cache@v4
        with:
          path: .cache/spamassassin-improved
          key: spamassassin-public-improved-v1

      - name: Cache Enron corpus
        uses: actions/cache@v4
        with:
          path: .cache/enron-spam-large
          key: enron-spam-large-v1

      - name: Cache Hugging Face corpora
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/v27-diverse50k
          key: v27-diverse50k-hf-v1

      - name: Run v27 diverse 50k benchmark
        run: python3 -u tools/benchmark_v27_diverse50k.py

      - name: Show result
        if: always()
        run: |
          if [ -f reports/v27-diverse50k.md ]; then
            cat reports/v27-diverse50k.md
            cat reports/v27-diverse50k.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "v27 report missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save evidence and model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-v27-diverse50k
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/v27-diverse50k.json
            reports/v27-diverse50k.md
            models/v27/
