name: MailGuard v40 fresh 50k low-FP

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/benchmark_v40_fresh50k.py'
      - '.github/workflows/v40-fresh50k.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      OMP_NUM_THREADS: 6
      MKL_NUM_THREADS: 6
      HF_HOME: .cache/huggingface

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy scikit-learn datasets pyarrow
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Start Rspamd and Redis
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d redis rspamd

      - name: Cache public corpora
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/spamassassin-improved
            .cache/enron-spam-large
          key: v40-public-corpora-v1
          restore-keys: |
            v39-public-corpora-v1
            v38-public-corpora-v1
            v37-public-corpora-v1
            v36-public-corpora-v1

      - name: Cache v40 fresh split
        uses: actions/cache@v4
        with:
          path: .cache/v40-fresh50k
          key: v40-fresh50k-v1

      - name: Run v40 fresh 50k benchmark
        run: python3 -u tools/benchmark_v40_fresh50k.py

      - name: Show result
        if: always()
        run: |
          if [ -f reports/v40-fresh50k.md ]; then
            cat reports/v40-fresh50k.md
            cat reports/v40-fresh50k.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "v40 report missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save evidence and model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-v40-fresh50k-lowfp
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/v40-fresh50k.json
            reports/v40-fresh50k.md
            reports/v40-error-analysis.json
            models/v40/
