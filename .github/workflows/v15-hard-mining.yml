name: MailGuard v15 hard-example benchmark

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/benchmark_v15_hard_mining.py'
      - 'tools/benchmark_v5.py'
      - 'tools/benchmark_v3.py'
      - 'tools/benchmark_improved.py'
      - '.github/workflows/v15-hard-mining.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy scikit-learn

      - name: Start Rspamd and Redis
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d redis rspamd
          docker compose ps

      - name: Cache public corpus
        uses: actions/cache@v4
        with:
          path: .cache/spamassassin-improved
          key: spamassassin-public-improved-v1

      - name: Run MailGuard v15 benchmark
        run: python3 -u tools/benchmark_v15_hard_mining.py

      - name: Show result
        if: always()
        run: |
          if [ -f reports/v15-benchmark.md ]; then
            cat reports/v15-benchmark.md
            cat reports/v15-benchmark.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark report missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-v15-hard-example-mining
          retention-days: 30
          if-no-files-found: warn
          path: reports/
