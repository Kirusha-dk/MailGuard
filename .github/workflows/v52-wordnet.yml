name: MailGuard v52 word and bigram neural model
on:
  workflow_dispatch:
  push:
    branches: [mailguard-v48-calibrated]
    paths: ['tools/train_v52_wordnet.py', '.github/workflows/v52-wordnet.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: v52-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v40-fresh50k
          key: v40-fresh50k-v1
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v48-evidence
          run-id: 37990866495
          github-token: ${{ github.token }}
          path: .cache/v48-artifact
      - run: python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python3 -m pip install numpy scipy scikit-learn joblib datasets
      - run: python3 -m unittest discover -s tests/python -p 'test_v*.py'
      - name: 1000-row experiment
        run: python3 -u tools/train_v52_wordnet.py --limit 1000 --epochs 2 --output reports/v52-smoke
      - name: Full supervised training
        run: python3 -u tools/train_v52_wordnet.py --limit 0 --epochs 8 --output reports/v52-full
      - name: Fixed-model engineering comparison
        run: python3 -u tools/evaluate_v48_fresh.py --artifact-root reports --model-subdir v52-full --count 100000 --min-recall .98 --max-fp 100 --output reports/v52-engineering
      - name: Summary
        if: always()
        run: |
          for report in reports/v52-full/report.md reports/v52-engineering/report.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailguard-v52-evidence
          path: reports/v52-*/
          retention-days: 30
