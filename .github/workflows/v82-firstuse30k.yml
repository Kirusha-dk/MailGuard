name: MailGuard locked v82 first-use30000 English spam
on:
  push:
    branches: [mailguard-v82-external-20261102]
    paths: [tools/evaluate_v82_firstuse30k.py, .github/workflows/v82-firstuse30k.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: mailguard-v82-firstuse30k-20261104
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned inference and MIME dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-v82.txt
          python -m py_compile tools/evaluate_v82_firstuse30k.py
          python -m unittest discover -s tests/python -p test_v82_firstuse30k.py -v
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/v82/backbone
            .cache/v79/frozen
            .cache/v80/extra
          key: v82-pinned-english-corpus-and-minilm-1110a243-v1
      - name: Require the existing pinned reference corpora
        run: |
          test -f .cache/v79/frozen/frozen.json
          test -f .cache/v80/extra/frozen.json
          test -f .cache/v82/backbone/manifest.json
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v82-english-20261020-state
          run-id: '41782185080'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: fresh-state
      - uses: actions/download-artifact@v4
        with:
          name: v64-transfer-prior-exclusions
          run-id: '38629238441'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior-blocks
      - uses: actions/download-artifact@v4
        with:
          pattern: v64-new500k-input-*
          run-id: '38635836571'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: old-tests
          merge-multiple: true
      - name: Freeze exactly30000 first-use English messages without model inference
        run: python -u tools/evaluate_v82_firstuse30k.py --phase freeze
        timeout-minutes: 75
      - name: Score locked checkpoint and threshold; zero optimizer steps
        run: python -u tools/evaluate_v82_firstuse30k.py --phase score
        timeout-minutes: 35
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailguard-v82-firstuse30k-step8000
          path: fresh30k-output/
          retention-days: 90
          if-no-files-found: warn
