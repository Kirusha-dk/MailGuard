name: MailGuard v45 domain-robust fast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/train_v45_domain_robust.py'
      - '.github/workflows/v45-domain-robust.yml'

permissions:
  contents: read

concurrency:
  group: mailguard-v45-domain-robust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: 6
      MKL_NUM_THREADS: 6
      HF_HOME: .cache/huggingface

    steps:
      - uses: actions/checkout@v4

      - name: Restore EXACT frozen v40 corpus
        uses: actions/cache/restore@v4
        with:
          path: .cache/v40-fresh50k
          key: v40-fresh50k-v1
          fail-on-cache-miss: true

      - name: Restore public dataset cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/huggingface
          key: v45-public-datasets-v1

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy scikit-learn datasets pyarrow joblib

      - name: Train v45 fast domain-robust candidate
        run: python3 -u tools/train_v45_domain_robust.py

      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/v45-domain-robust.md ]; then
            cat reports/v45-domain-robust.md
            cat reports/v45-domain-robust.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "v45 did not reach a final report; inspect logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save v45 model and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-v45-domain-robust
          retention-days: 30
          if-no-files-found: warn
          path: |
            models/v45/
            reports/v45-domain-robust.json
            reports/v45-domain-robust.md
