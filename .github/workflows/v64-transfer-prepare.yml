name: MailGuard v64 first-use 500k transfer corpus
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v64-transfer-prepare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  blocks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v59-data
          key: mailguard-v59-prior-blocking-v1
          fail-on-cache-miss: true
      - name: Preserve immutable whole-source exclusion checkpoint
        run: mv .cache/v59-data .cache/v64-prior
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v59-data
          key: mailguard-v59-new-mail-v1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v60-data
          key: mailguard-v60-new-mail-v1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v61-new
          key: mailguard-v61-october-20261013-v1
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          pattern: v62-500k-input-*
          run-id: 38518407108
          github-token: ${{ github.token }}
          path: previous/spam
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v62-large-ham-corpus
          run-id: 38535255118
          github-token: ${{ github.token }}
          path: previous/ham
      - name: Data parsing dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 datasets
      - name: Verify exclusion and original source parsing protocol
        run: python -m unittest discover -s tests/python -p 'test_v64_transfer.py'
      - name: Block all previous development, engineering tests and whole prior source pools
        run: python -u tools/prepare_v64_transfer.py --phase blocks --output prior-blocks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v64-transfer-prior-exclusions
          path: prior-blocks/
          compression-level: 0
          retention-days: 90
  collect:
    needs: blocks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source: [independent, '2016', '2015', '2014', '2013']
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v64-transfer-prior-exclusions
          path: prior-blocks
      - uses: actions/download-artifact@v4
        if: matrix.source == 'independent'
        with:
          name: mailguard-v64-new-source-inputs
          run-id: 38624082220
          github-token: ${{ github.token }}
          path: new-sources
      - name: Text parsing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0
      - name: Collect unseen identities and campaign families without model inference
        run: python -u tools/prepare_v64_transfer.py --phase collect --source '${{ matrix.source }}' --output candidates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v64-new-candidates-${{ matrix.source }}
          path: |
            candidates/candidates.jsonl.gz
            candidates/audit.json
          compression-level: 0
          retention-days: 90
  freeze:
    needs: [blocks, collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v64-transfer-prior-exclusions
          path: prior-blocks
      - uses: actions/download-artifact@v4
        with:
          pattern: v64-new-candidates-*
          path: candidates
      - name: Global duplicate and conflict audit; lock exactly 500000 before any scoring
        run: python -u tools/prepare_v64_transfer.py --phase merge --input candidates --count 500000 --output prepared
      - uses: actions/upload-artifact@v4
        with:
          name: v64-new500k-audit
          path: prepared/audit.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v64-new500k-input-0
          path: prepared/input-0.jsonl.gz
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v64-new500k-input-1
          path: prepared/input-1.jsonl.gz
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v64-new500k-input-2
          path: prepared/input-2.jsonl.gz
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v64-new500k-input-3
          path: prepared/input-3.jsonl.gz
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: v64-new500k-input-4
          path: prepared/input-4.jsonl.gz
          compression-level: 0
          retention-days: 90
      - name: Preserve permanent first-use corpus, provenance and source code before evaluation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf mailguard-v64-new500k-inputs.tar.gz prepared prior-blocks
          git archive --format=tar.gz --output=mailguard-v64-transfer-prepare-source.tar.gz '${{ github.sha }}'
          sha256sum mailguard-v64-new500k-inputs.tar.gz mailguard-v64-transfer-prepare-source.tar.gz > mailguard-v64-new500k-inputs.sha256
          gh release create "mailguard-v64-new500k-inputs-${{ github.run_id }}" --draft \
            --target 3a4c834aa61f3b0cbd5725543f22a1225ff3f839 \
            --title 'MailGuard v64: first-use transfer corpus, fixed before scoring' \
            --notes 'Historical public mail, not customer mail. Original labels and source hashes preserved. No model inference or score-based selection in collection. GenSpam: Ben Medlock, CEAS 2006. Phishing corpus: Jose Nazario, CC-BY-4.0. Spam traps: Bruce Guenter, untroubled.org.' \
            mailguard-v64-new500k-inputs.tar.gz mailguard-v64-transfer-prepare-source.tar.gz mailguard-v64-new500k-inputs.sha256
