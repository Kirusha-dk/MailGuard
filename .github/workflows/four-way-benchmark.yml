name: Four-way Rspamd comparison

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/benchmark_four_way.py'
      - 'rspamd/**'
      - 'docker-compose.yml'
      - '.github/workflows/four-way-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Start Rspamd and Redis
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d redis rspamd
          docker compose ps

      - name: Cache public corpus
        uses: actions/cache@v4
        with:
          path: .cache/spamassassin-four-way
          key: spamassassin-public-four-way-v1

      - name: Run four-way comparison
        run: python3 tools/benchmark_four_way.py

      - name: Show result
        if: always()
        run: |
          if [ -f reports/four-way-benchmark.md ]; then
            cat reports/four-way-benchmark.md
            cat reports/four-way-benchmark.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark report missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-four-way-benchmark
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/

      - name: Save Docker logs on failure
        if: failure()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/docker-four-way.log 2>&1 || true
