name: MailGuard v66 new-source provenance and overlap screening
on:
  workflow_dispatch:
  push:
    branches: [mailguard-v48-calibrated]
    paths:
      - tools/prepare_v66_candidate_audit.py
      - tests/python/test_v66_candidate_audit.py
      - .github/workflows/v66-candidate-audit.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mailguard-v66-candidate-audit-\${{ github.ref }}
  cancel-in-progress: false
jobs:
  first-use-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v64-transfer-prior-exclusions
          run-id: 38629238441
          github-token: \${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          pattern: v64-new500k-input-*
          run-id: 38635836571
          github-token: \${{ github.token }}
          path: previous
          merge-multiple: true
      - name: Install audited parsing dependencies
        run: python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0
      - name: Unit checks before reading any new source
        run: python -m unittest discover -s tests/python -p 'test_v66_candidate_audit.py' -v
      - name: Check original publisher labels, fingerprints and all old pools without model inference
        run: |
          python -u tools/prepare_v66_candidate_audit.py \
            --prior prior/blocked.sqlite --old-input previous --output report
          cat report/audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailguard-v66-candidate-provenance
          path: report/
          retention-days: 90
      - name: Commit audit counts, fingerprints and source provenance only
        run: |
          cp report/audit.json /tmp/mailguard-v66-audit.json
          cp report/audit.md /tmp/mailguard-v66-audit.md
          git fetch origin mailguard-v48-calibrated
          git checkout -B mailguard-v48-calibrated origin/mailguard-v48-calibrated
          cp /tmp/mailguard-v66-audit.json reports/v66-candidate-audit.json
          cp /tmp/mailguard-v66-audit.md reports/v66-candidate-audit.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/v66-candidate-audit.json reports/v66-candidate-audit.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record publisher provenance and first-use candidate exclusions'
            git push origin HEAD:mailguard-v48-calibrated
          fi
