name: MailGuard v47 phishing-aware hybrid

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/train_v47_phishing_aware.py'
      - '.github/workflows/v47-phishing-aware.yml'

permissions:
  contents: read

concurrency:
  group: mailguard-v47-phishing-aware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: .cache/huggingface

    steps:
      - uses: actions/checkout@v4

      - name: Restore frozen v40 engineering corpus
        uses: actions/cache/restore@v4
        with:
          path: .cache/v40-fresh50k
          key: v40-fresh50k-v1
          fail-on-cache-miss: true

      - name: Restore Hugging Face cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/huggingface
          key: v47-hf-${{ runner.os }}
          restore-keys: |
            v46-hf-${{ runner.os }}-
            v47-hf-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy scikit-learn datasets pyarrow joblib sentence-transformers

      - name: Syntax check
        run: python3 -m py_compile tools/train_v47_phishing_aware.py

      - name: Train and evaluate v47
        run: python3 -u tools/train_v47_phishing_aware.py

      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/v47-phishing-aware-hybrid.md ]; then
            cat reports/v47-phishing-aware-hybrid.md
            cat reports/v47-phishing-aware-hybrid.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "v47 did not produce a final report; inspect logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save v47 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-v47-phishing-aware-hybrid
          retention-days: 30
          if-no-files-found: warn
          path: |
            models/v47/
            reports/v47-phishing-aware-hybrid.json
            reports/v47-phishing-aware-hybrid.md

      - name: Save Hugging Face cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/huggingface
          key: v47-hf-${{ runner.os }}-${{ github.run_id }}
