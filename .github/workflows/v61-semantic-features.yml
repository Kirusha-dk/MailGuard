name: MailGuard v61 semantic development features
on:
  workflow_dispatch:
  push:
    branches: [mailguard-v48-calibrated]
    paths: ['tools/v61_semantic.py', 'tools/prepare_v61_features.py', '.github/workflows/v61-semantic-features.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: v61-semantic-features-${{ github.ref }}
  cancel-in-progress: true
jobs:
  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      HF_HUB_DISABLE_XET: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: features
        with:
          path: .cache/v61-dev
          key: mailguard-v61-semantic-dev-v1
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v60-data
          key: mailguard-v60-new-mail-v1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: .cache/v40-fresh50k
          key: v40-fresh50k-v1
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v60-evidence
          run-id: 38387733735
          github-token: ${{ github.token }}
          path: .cache/v60-evidence
      - name: Locate frozen base model
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          files=list(Path('.cache/v60-evidence').rglob('v60-full/model.joblib'))
          if len(files)!=1: raise ValueError('Expected one v60 bundle')
          shutil.copytree(files[0].parent,'.cache/v60-model')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: mailguard-v54-unique500k-evidence
          run-id: 38092976048
          github-token: ${{ github.token }}
          path: .cache/v54-evidence
      - name: Dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 onnxruntime==1.23.2 tokenizers==0.22.1 huggingface_hub==0.36.0
      - name: Encode TRAIN/SELECT/CAL; new October TEST is absent from this job
        if: steps.features.outputs.cache-hit != 'true'
        run: python -u tools/prepare_v61_features.py
      - uses: actions/cache/save@v4
        if: steps.features.outputs.cache-hit != 'true'
        with:
          path: .cache/v61-dev
          key: mailguard-v61-semantic-dev-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailguard-v61-development-audit
          path: |
            .cache/v61-dev/manifest.json
            .cache/v61-dev/encoder/manifest.json
          include-hidden-files: true
          retention-days: 90
