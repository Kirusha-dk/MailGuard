name: MailGuard 33k large benchmark

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/benchmark_v15_large_enron.py'
      - '.github/workflows/v15-large-enron.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy scikit-learn

      - name: Start Rspamd and Redis
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d redis rspamd
          docker compose ps

      - name: Cache SpamAssassin corpus
        uses: actions/cache@v4
        with:
          path: .cache/spamassassin-improved
          key: spamassassin-public-improved-v1

      - name: Cache Enron-Spam corpus
        uses: actions/cache@v4
        with:
          path: .cache/enron-spam-large
          key: enron-spam-large-v1

      - name: Run 33k large benchmark
        run: python3 -u tools/benchmark_v15_large_enron.py

      - name: Show result
        if: always()
        run: |
          if [ -f reports/v15-large-enron.md ]; then
            cat reports/v15-large-enron.md
            cat reports/v15-large-enron.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Large benchmark report missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-v15-large-enron
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/v15-large-enron.json
            reports/v15-large-enron.md
