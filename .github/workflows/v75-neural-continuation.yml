name: MailGuard v75 longer-neural RU EN and guarded v69 blend
on:
  workflow_dispatch:
  push:
    branches: [mailguard-v48-calibrated]
    paths:
      - tools/v75_neural_continuation.py
      - tests/python/test_v75_neural_continuation.py
      - .github/workflows/v75-neural-continuation.yml
permissions:
  contents: read
concurrency:
  group: mailguard-v75-${{ github.ref }}
  cancel-in-progress: false
jobs:
  neural-continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen v74 semantic encoder and classifier
        uses: actions/download-artifact@v4
        with:
          run-id: 39009727058
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: mailguard-v74-transformer-model-and-retrospective-report
          path: frozen-v74
      - name: Download frozen v69 word and character classifier
        uses: actions/download-artifact@v4
        with:
          run-id: 38859270577
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: mailguard-v69-ru-en-nbsvm-research
          path: frozen-v69
      - name: Install CPU Torch and avoid incompatible optional vision extension
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip uninstall -y torchvision torchaudio || true
      - name: Install pretrained Transformer and corpus dependencies
        run: |
          python -m pip install transformers==4.46.3 sentencepiece==0.2.1 safetensors==0.4.5 numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 "datasets>=3.6,<5" "huggingface_hub>=0.33,<1"
      - name: Enforce deterministic subsets and FP thresholds in unit tests
        run: |
          python -m unittest discover -s tests/python -p 'test_v75_neural_continuation.py' -v
          python -m unittest discover -s tests/python -p 'test_v74_transformer_finetune.py' -v
          ls frozen-v74/checkpoint/model.safetensors frozen-v69/model.joblib
      - name: Continue neural learning on 10k TRAIN, then CAL-only blend
        run: |
          python -u tools/v75_neural_continuation.py --out research-v75
          cat research-v75/result.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailguard-v75-continued-neural-and-cal-gated-reports
          path: |
            research-v75/cohort-frozen.json
            research-v75/checkpoint-locked.json
            research-v75/policies-locked-before-test.json
            research-v75/result.json
            research-v75/result.md
            research-v75/checkpoint
          retention-days: 90
          compression-level: 1
      - name: Commit only aggregate metrics, never message text
        if: success()
        run: |
          cp research-v75/result.json /tmp/v75-result.json
          cp research-v75/result.md /tmp/v75-result.md
          cp research-v75/cohort-frozen.json /tmp/v75-freeze.json
          cp research-v75/checkpoint-locked.json /tmp/v75-model.json
          cp research-v75/policies-locked-before-test.json /tmp/v75-policies.json
          git fetch origin mailguard-v48-calibrated
          git checkout -B mailguard-v48-calibrated origin/mailguard-v48-calibrated
          cp /tmp/v75-result.json reports/v75-neural-result.json
          cp /tmp/v75-result.md reports/v75-neural-result.md
          cp /tmp/v75-freeze.json reports/v75-neural-frozen.json
          cp /tmp/v75-model.json reports/v75-neural-locked.json
          cp /tmp/v75-policies.json reports/v75-neural-policies.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/v75-neural-result.json reports/v75-neural-result.md reports/v75-neural-frozen.json reports/v75-neural-locked.json reports/v75-neural-policies.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record v75 extended RU-EN Transformer fit with SELECT/CAL-separated blend'
            git push origin HEAD:mailguard-v48-calibrated
          fi
