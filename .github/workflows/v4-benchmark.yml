name: MailGuard v4 ham-veto benchmark

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/benchmark_v4.py'
      - 'tools/benchmark_v3.py'
      - 'tools/benchmark_improved.py'
      - 'rspamd/**'
      - 'docker-compose.yml'
      - '.github/workflows/v4-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install benchmark dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scipy scikit-learn

      - name: Start Rspamd and Redis
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d redis rspamd
          docker compose ps

      - name: Cache public corpus
        uses: actions/cache@v4
        with:
          path: .cache/spamassassin-improved
          key: spamassassin-public-improved-v1

      - name: Run MailGuard v4 benchmark
        run: python3 tools/benchmark_v4.py

      - name: Show result
        if: always()
        run: |
          if [ -f reports/v4-benchmark.md ]; then
            cat reports/v4-benchmark.md
            cat reports/v4-benchmark.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark report missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailguard-v4-benchmark
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/

      - name: Save Docker logs on failure
        if: failure()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/docker-v4.log 2>&1 || true
